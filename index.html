<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Codix AI</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
:root[data-theme="dark"]{
  --bg:#000; --panel:#0b0b0b; --surface:#1a1a1a; --hover:#161616; --border:#262626;
  --text:#ececec; --muted:#8c8c8c; --btn:#ececec; --btn-text:#000; --code-bg:#0f0f0f;
  --c-key:#d4d4d4; --c-str:#a8b5a2; --c-num:#c9b48a; --c-com:#6b6b6b; --c-fn:#9db4cc; --err:#e5736b;
}
:root[data-theme="light"]{
  --bg:#fff; --panel:#f7f7f7; --surface:#f0f0f0; --hover:#efefef; --border:#e3e3e3;
  --text:#121212; --muted:#6e6e6e; --btn:#121212; --btn-text:#fff; --code-bg:#f6f6f6;
  --c-key:#2b2b2b; --c-str:#4d6b45; --c-num:#8a6a1f; --c-com:#9a9a9a; --c-fn:#2f5d8a; --err:#c0392b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--muted);outline-offset:2px}
svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Sidebar */
#side{width:268px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;flex:none;transition:transform .2s}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;font-weight:600;font-size:16px;letter-spacing:-.01em}
.logo{width:28px;height:28px;border-radius:8px;background:var(--btn);color:var(--btn-text);display:grid;place-items:center;font:700 12px ui-monospace,Menlo,Consolas,monospace}
#newChat{margin:4px 12px 8px;padding:9px 12px;border:1px solid var(--border);border-radius:10px;display:flex;gap:8px;align-items:center}
#newChat:hover,.item:hover{background:var(--hover)}
#list{flex:1;overflow-y:auto;padding:4px 8px}
.item{display:flex;align-items:center;border-radius:8px;padding:0 4px 0 10px}
.item.active{background:var(--surface)}
.item .t{flex:1;padding:8px 0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.item .del{opacity:0;padding:6px;color:var(--muted);border-radius:6px}
.item:hover .del,.item .del:focus-visible{opacity:1}
.item .del:hover{color:var(--err)}
.sfoot{padding:0 12px 10px;display:flex;gap:6px}
.sfoot button{flex:1;display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;font-size:14px;color:var(--muted)}
.sfoot button:hover{background:var(--hover);color:var(--text)}

/* Main */
main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
.top{display:flex;align-items:center;gap:8px;padding:10px 14px;flex:none}
.top .icon{display:none;padding:6px;border-radius:8px}
.top .tt{display:none}
#modelBtn{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:12px;font-weight:600;font-size:15px;max-width:min(60vw,360px);min-width:0}
#modelBtn:hover{background:var(--hover)}
#modelBtn svg{width:16px;height:16px;color:var(--muted)}
#modelBtn .chev{width:14px;height:14px;transition:transform .25s ease}
#modelBtn[aria-expanded="true"] .chev{transform:rotate(180deg)}
#modelName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#scroll{flex:1;overflow-y:auto;scroll-behavior:smooth}
.wrap{max-width:740px;margin:0 auto;padding:20px 20px 12px}
.empty{min-height:56vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.empty .logo{width:44px;height:44px;border-radius:12px;font-size:17px}
.empty h1{font-size:26px;letter-spacing:-.02em;font-weight:600}
.empty p{color:var(--muted)}
.sugg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px;width:100%;max-width:520px}
.sugg button{padding:12px 14px;border:1px solid var(--border);border-radius:12px;text-align:left;font-size:14px;color:var(--muted)}
.sugg button:hover{background:var(--hover);color:var(--text)}
.msg{margin-bottom:26px}
.msg.user{display:flex;justify-content:flex-end}
.msg.user .bubble{background:var(--surface);padding:9px 15px;border-radius:18px;max-width:85%;white-space:pre-wrap;word-break:break-word}
.msg.ai .who{font-size:13px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.msg.ai .who .logo{width:20px;height:20px;border-radius:6px;font-size:8px}
.md{word-break:break-word}
.md>*+*{margin-top:12px}
.md ul,.md ol{padding-left:22px}
.md li+li{margin-top:4px}
.md h1,.md h2,.md h3{font-size:1.05em;line-height:1.35}
.md a{color:inherit;text-decoration:underline;text-underline-offset:3px}
.md blockquote{border-left:2px solid var(--border);padding-left:14px;color:var(--muted)}
.md table{border-collapse:collapse;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.md :not(pre)>code{background:var(--surface);padding:1px 6px;border-radius:5px;font-size:.88em}
code,pre{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.codebox{border:1px solid var(--border);border-radius:12px;background:var(--code-bg);overflow:hidden}
.codebar{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 6px 14px;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted)}
.copy{display:flex;gap:6px;align-items:center;padding:4px 8px;border-radius:6px;font-size:12px;color:var(--muted)}
.copy:hover{background:var(--hover);color:var(--text)}
.copy svg{width:14px;height:14px}
.md pre{overflow-x:auto;padding:14px;font-size:13px;line-height:1.55}
.md pre code{background:none;padding:0;font-size:inherit}
.hljs-keyword,.hljs-literal,.hljs-selector-tag,.hljs-meta{color:var(--c-key);font-weight:600}
.hljs-string,.hljs-regexp,.hljs-attr{color:var(--c-str)}
.hljs-number,.hljs-symbol,.hljs-bullet{color:var(--c-num)}
.hljs-comment,.hljs-quote{color:var(--c-com);font-style:italic}
.hljs-title,.hljs-built_in,.hljs-type,.hljs-class .hljs-title,.hljs-name,.hljs-variable{color:var(--c-fn)}
.cursor::after{content:"";display:inline-block;width:7px;height:15px;background:var(--text);margin-left:2px;vertical-align:-2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* Composer */
.composer{padding:8px 20px calc(14px + env(safe-area-inset-bottom))}
.box{max-width:740px;margin:0 auto;border:1px solid var(--border);background:var(--panel);border-radius:18px;display:flex;align-items:flex-end;gap:8px;padding:8px 8px 8px 16px}
.box:focus-within{border-color:var(--muted)}
textarea{flex:1;resize:none;background:none;border:0;color:var(--text);font:inherit;max-height:200px;padding:6px 0;outline:0}
textarea::placeholder{color:var(--muted)}
#go{width:34px;height:34px;border-radius:50%;background:var(--btn);color:var(--btn-text);display:grid;place-items:center;flex:none}
#go:disabled{opacity:.3;cursor:default}
.note{max-width:740px;margin:8px auto 0;text-align:center;font-size:12px;color:var(--muted)}
.error.soft{border-color:var(--border);color:var(--muted)}
.error{max-width:740px;margin:0 auto 8px;padding:10px 14px;border:1px solid var(--err);color:var(--err);border-radius:12px;font-size:13px;display:none;word-break:break-word}

/* Dialog umum */
dialog{margin:auto;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:16px;padding:22px;width:min(440px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.6)}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
input{width:100%;padding:9px 12px;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:10px;font:inherit}
.btn{padding:8px 16px;border-radius:10px;border:1px solid var(--border)}
.btn.primary{background:var(--btn);color:var(--btn-text);border-color:var(--btn)}

/* Pemilih model */
#mdlg{padding:0;width:min(480px,calc(100vw - 24px));max-height:min(640px,84vh);overflow:hidden}
#mdlg[open]{display:flex;flex-direction:column}
.mhead{padding:18px 18px 12px;flex:none}
.mhead h2{font-size:17px;margin-bottom:12px}
.mhead input{margin:0}
#mlist{overflow-y:auto;padding:0 8px 8px;flex:1;min-height:120px}
.mgroup{padding:14px 10px 6px;font-size:12px;font-weight:600;color:var(--muted)}
.mnote{padding:2px 10px 8px;font-size:13px;color:var(--muted)}
.mrow{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:10px;text-align:left}
.mrow:hover{background:var(--hover)}
.mrow.sel{background:var(--surface)}
.mrow .mn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.mrow .mm{font-size:12px;color:var(--muted);flex:none}
.mrow .ck{width:16px;height:16px;opacity:0}
.mrow.sel .ck{opacity:1}
.mempty{padding:28px 12px;text-align:center;color:var(--muted);font-size:14px}
.mfoot{flex:none;padding:10px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border);font-size:12px;color:var(--muted)}

/* Animasi */
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
@keyframes sheet{from{opacity:.6;transform:translateY(60px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
body,#side,.box,.bubble,.codebox,.avatar,input,dialog,.sugg button,.item,.btn,.copy,.mrow{transition:background-color .3s ease,border-color .3s ease,color .3s ease}
.msg.enter{animation:rise .4s cubic-bezier(.2,.7,.2,1) both}
.swap{animation:fade .35s ease}
.item.fresh{animation:slideIn .4s cubic-bezier(.2,.7,.2,1)}
.empty .logo,.empty h1,.empty p{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.empty h1{animation-delay:.06s}.empty p{animation-delay:.12s}
.sugg button{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
.error{animation:rise .3s ease}
dialog[open]{animation:pop .28s cubic-bezier(.2,.8,.2,1)}
dialog[open]::backdrop{animation:fade .28s ease}
#go{transition:transform .15s ease,opacity .25s ease}
#go:not(:disabled):active{transform:scale(.88)}
#go:not(:disabled):hover{transform:scale(1.06)}
.btn:active{transform:scale(.97)}
input{transition:border-color .2s ease,background-color .3s ease}
input:focus{border-color:var(--muted)}
.dots{display:inline-flex;gap:5px;padding:9px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bounce 1.1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.mrow{animation:fade .25s ease both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}#scroll{scroll-behavior:auto}}

/* TikTok */
.tt{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid var(--border);border-radius:999px;font-size:12px;font-weight:500;color:var(--muted);text-decoration:none;transition:background-color .2s ease,color .2s ease,border-color .3s ease,transform .15s ease}
.tt svg{width:14px;height:14px}
.tt:hover{background:var(--hover);color:var(--text)}
.tt:active{transform:scale(.95)}

/* User bar */
.userbar{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--border)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
#uname{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#logout{padding:6px;border-radius:8px;color:var(--muted);display:grid;place-items:center}
#logout:hover{background:var(--hover);color:var(--text)}

/* Login */
#auth{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:16px;overflow-y:auto;transition:opacity .5s ease,visibility 0s}
#auth.hide{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .5s ease,visibility 0s .5s}
#auth .card{width:min(380px,100%);background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:30px 26px 26px;animation:rise .65s cubic-bezier(.2,.7,.2,1) backwards;transition:transform .5s cubic-bezier(.2,.7,.2,1),opacity .4s ease,background-color .3s ease,border-color .3s ease}
#auth.hide .card{transform:translateY(-14px) scale(1.03);opacity:0}
#auth.instant,#auth.instant *{transition:none!important;animation:none!important}
#auth .card.shake{animation:shake .4s ease}
.card .logo{width:40px;height:40px;border-radius:11px;font-size:15px}
.card h1{font-size:22px;letter-spacing:-.02em;font-weight:600;margin-top:14px}
.card .sub{color:var(--muted);font-size:14px;margin-top:2px;min-height:21px}
.tabs{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:3px;margin:20px 0 6px}
.pill{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:var(--surface);border-radius:9px;transition:transform .38s cubic-bezier(.3,.8,.3,1)}
.tabs.reg .pill{transform:translateX(100%)}
.tab{position:relative;padding:8px;color:var(--muted);transition:color .25s ease;font-size:14px}
.tab.active{color:var(--text)}
.mhead .tabs{margin:0}
.aerr{min-height:20px;margin-top:10px;font-size:13px;color:var(--err)}
.btn.wide{width:100%;padding:11px;margin-top:2px}
.btn:disabled{opacity:.5;cursor:default}

#shade{display:none}
@media (max-width:760px){
  #side{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%);width:280px}
  body.open #side{transform:none}
  body.open #shade{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10}
  .top{border-bottom:1px solid var(--border);padding:8px 10px}
  .top .icon{display:grid}
  .top .tt{display:inline-flex}
  .sugg{grid-template-columns:1fr}
  .wrap{padding:18px 14px 8px}
  .composer{padding-left:12px;padding-right:12px}
  #mdlg{margin:auto auto 0;width:100%;max-width:100%;max-height:86vh;border-radius:20px 20px 0 0;border-bottom:0}
  #mdlg[open]{animation:sheet .32s cubic-bezier(.2,.8,.2,1)}
}
</style>
</head>
<body>

<aside id="side">
  <div class="brand"><span class="logo">&lt;/&gt;</span>Codix AI<a class="tt" href="https://www.tiktok.com/@sannproject61" target="_blank" rel="noopener noreferrer" aria-label="Buka TikTok @sannproject61"><svg viewBox="0 0 24 24"><path d="M16 3v9.5a4.5 4.5 0 1 1-4.5-4.5M16 3c.4 2.6 2 4.2 4.5 4.4"/></svg>TikTok</a></div>
  <button id="newChat"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Chat baru</button>
  <div id="list"></div>
  <div class="userbar">
    <span class="avatar" id="avatar"></span><span id="uname"></span>
    <button id="logout" aria-label="Keluar" title="Keluar"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
  </div>
  <div class="sfoot">
    <button id="themeBtn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span id="themeLabel">Mode terang</span></button>
  </div>
</aside>
<div id="shade"></div>

<main>
  <div class="top">
    <button class="icon" id="menuBtn" aria-label="Buka menu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <button id="modelBtn" aria-haspopup="dialog" aria-expanded="false" aria-label="Pilih model AI">
      <svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/><path d="M9 1v4M15 1v4M9 19v4M15 19v4M1 9h4M1 15h4M19 9h4M19 15h4"/></svg>
      <span id="modelName">Pilih model</span>
      <svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <a class="tt" href="https://www.tiktok.com/@sannproject61" target="_blank" rel="noopener noreferrer" aria-label="Buka TikTok @sannproject61"><svg viewBox="0 0 24 24"><path d="M16 3v9.5a4.5 4.5 0 1 1-4.5-4.5M16 3c.4 2.6 2 4.2 4.5 4.4"/></svg>TikTok</a>
  </div>
  <div id="scroll"><div class="wrap" id="msgs"></div></div>
  <div class="composer">
    <div class="error" id="err"></div>
    <div class="box">
      <textarea id="input" rows="1" placeholder="Tanya Codix AI soal coding..."></textarea>
      <button id="go" aria-label="Kirim"><svg viewBox="0 0 24 24" id="goIcon"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </div>
    <div class="note">Codix AI bisa salah. Cek ulang kode sebelum dipakai.</div>
  </div>
</main>

<div id="auth">
  <div class="card" id="card">
    <div class="logo">&lt;/&gt;</div>
    <h1>Codix AI</h1>
    <p class="sub" id="asub">Masuk untuk lanjut ngoding.</p>
    <div class="tabs" id="tabs" role="tablist">
      <span class="pill"></span>
      <button type="button" class="tab active" id="tLogin" role="tab">Masuk</button>
      <button type="button" class="tab" id="tReg" role="tab">Daftar</button>
    </div>
    <div id="aform">
      <label for="au">Username</label>
      <input id="au" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="contoh: budi_01">
      <label for="ap">Password</label>
      <input id="ap" type="password" autocomplete="current-password" placeholder="minimal 4 karakter">
      <div class="aerr" id="aerr" role="alert"></div>
      <button class="btn primary wide" id="abtn" type="button">Masuk</button>
    </div>
  </div>
</div>

<dialog id="mdlg" aria-label="Pilih model AI">
  <div class="mhead">
    <h2>Pilih model</h2>
    <input id="msearch" type="search" placeholder="Cari model (deepseek, qwen, mistral...)" autocomplete="off">
  </div>
  <div id="mlist"></div>
  <div class="mfoot" id="mfoot">Hanya model gratis dari xKiro.</div>
</dialog>

<script>
/* =====================================================
   ISI API KEY xKiro KAMU DI SINI (di antara kutip)
   ===================================================== */
const CONFIG = {
  API_KEY: "sk-xt-8cd527ec5f7d5154a25857ec51d0417951ab39d371527185",   // <-- API key xKiro kamu
  MODEL:   ""    // opsional: model awal. Kosongkan saja, pilih lewat tombol model di atas.
};
/* ===================================================== */

const API = 'https://api.xkiro.com/v1';   // xKiro
const KEY = (CONFIG.API_KEY||'').trim();
const NO_KEY_MSG = 'API key belum diisi. Buka file ini pakai text editor, lalu isi API_KEY di bagian CONFIG paling atas script.';

const SYSTEM = `Kamu adalah Codix AI, asisten AI yang ahli di bidang coding dan software engineering.
- Jawab dalam bahasa yang dipakai user (default Bahasa Indonesia, santai tapi jelas).
- Kasih kode yang lengkap, bisa langsung dijalankan, dan selalu pakai code block dengan nama bahasa.
- Jelaskan singkat apa yang kode lakukan dan kenapa dipilih begitu. Hindari bertele-tele.
- Kalau ada bug, cari akar masalahnya dulu, lalu kasih perbaikan.
- Sebutkan trade-off atau edge case penting kalau relevan.
- Kalau ditanya siapa kamu, jawab bahwa kamu Codix AI.`;

/* penyimpanan dengan fallback ke memori (kalau localStorage diblokir) */
const mem={};
const store={
  get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]??null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}
};
const load=(k,d)=>{try{return JSON.parse(store.get(k))??d}catch(e){return d}};

/* ===== daftar model (xKiro, HANYA yang gratis) ===== */
const FALLBACK=[
  {id:'deepseek/deepseek-v4-pro',name:'DeepSeek V4 Pro',ctx:1048576},
  {id:'deepseek/deepseek-v4-flash',name:'DeepSeek V4 Flash',ctx:1048576},
  {id:'deepseek/deepseek-v3.2',name:'DeepSeek V3.2',ctx:131072},
  {id:'qwen/qwen3.8-max:free',name:'Qwen3.8 Max',ctx:1000000},

  {id:'mistralai/devstral-medium',name:'Devstral 2',ctx:256000},

];
const MAIN=['deepseek','anthropic','openai','google'];
const VENDOR={deepseek:'DeepSeek',anthropic:'Claude',openai:'OpenAI',google:'Gemini','z-ai':'GLM',qwen:'Qwen',minimax:'MiniMax',mistralai:'Mistral',cohere:'Cohere',meta:'Meta',meituan:'LongCat',xiaomi:'MiMo',stealth:'Stealth',nvidia:'NVIDIA','dots-studio':'Dots',inclusionai:'Ling',sensenova:'SenseNova',liquid:'Liquid',moonshotai:'Kimi','x-ai':'Grok'};
const DEFAULT_MODEL='deepseek/deepseek-v4-pro';
const vendorOf=m=>m.id.split('/')[0];
const vendorLabel=v=>VENDOR[v]||(v.charAt(0).toUpperCase()+v.slice(1));

/* cache model lama tidak dipakai lagi */
let MODELS=load('codix:xmodels',null)||FALLBACK;
let modelsLive=!!store.get('codix:xmodels');
let model=store.get('codix:xmodel')||CONFIG.MODEL||DEFAULT_MODEL;

async function fetchModels(){
  const c=new AbortController(); const to=setTimeout(()=>c.abort(),9000);
  try{
    const res=await fetch(API+'/models',{signal:c.signal});
    if(!res.ok)throw new Error(res.status);
    const j=await res.json();
    const list=(j.data||[])
      .filter(x=>x.access_tier==='free'
        &&(!x.modality||x.modality==='chat')
        &&!Number(x.pricing?.input)&&!Number(x.pricing?.output))
      .map(x=>({id:x.id,name:(x.display_name||x.id).replace(/\s*\(free\)\s*$/i,''),ctx:x.context_length||0}));
    if(list.length){MODELS=list;modelsLive=true;store.set('codix:xmodels',JSON.stringify(list))}
  }catch(e){}
  finally{clearTimeout(to)}
  /* kalau model terpilih bukan model gratis yang tersedia, balik ke default */
  if(!MODELS.some(m=>m.id===model)){
    model=(MODELS.find(m=>m.id===DEFAULT_MODEL)||MODELS[0]).id;
    store.set('codix:xmodel',model);
  }
  updateModelBtn();
  if(mdlg.open)renderModels();
}

const $=s=>document.querySelector(s);
const mdlg=$('#mdlg'), msearch=$('#msearch'), mlist=$('#mlist');

function nameOf(id){
  const m=MODELS.find(x=>x.id===id);
  return m?m.name:id.split('/').pop().replace(/:free$/,'');
}
function updateModelBtn(){$('#modelName').textContent=nameOf(model)}

function renderModels(){
  const q=msearch.value.trim().toLowerCase();
  let list=MODELS.slice();
  if(q)list=list.filter(m=>(m.name+' '+m.id).toLowerCase().includes(q));
  const groups={};
  list.forEach(m=>(groups[vendorOf(m)]=groups[vendorOf(m)]||[]).push(m));
  const vendors=Object.keys(groups);
  if(!q)MAIN.forEach(v=>{if(!groups[v])vendors.push(v)});
  vendors.sort((a,b)=>{
    const ia=MAIN.indexOf(a),ib=MAIN.indexOf(b);
    if(ia>-1||ib>-1)return (ia<0?99:ia)-(ib<0?99:ib);
    return vendorLabel(a).localeCompare(vendorLabel(b));
  });
  mlist.innerHTML='';
  let n=0;
  vendors.forEach(v=>{
    const g=document.createElement('div'); g.className='mgroup'; g.textContent=vendorLabel(v); mlist.append(g);
    const items=(groups[v]||[]).sort((a,b)=>b.name.localeCompare(a.name,undefined,{numeric:true}));
    if(!items.length){
      const t=document.createElement('div'); t.className='mnote';
      t.textContent='Belum ada versi gratis di xKiro.'; mlist.append(t); return;
    }
    items.forEach(m=>{
      n++;
      const r=document.createElement('button'); r.type='button'; r.className='mrow'+(m.id===model?' sel':'');
      r.style.animationDelay=Math.min(n*12,240)+'ms';
      const a=document.createElement('span'); a.className='mn'; a.textContent=m.name;
      const b=document.createElement('span'); b.className='mm';
      b.textContent=m.ctx?(m.ctx>=1e6?Math.round(m.ctx/1e6)+'M':Math.round(m.ctx/1000)+'K'):'';
      r.append(a,b);
      r.insertAdjacentHTML('beforeend','<svg class="ck" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>');
      r.onclick=()=>{model=m.id;store.set('codix:xmodel',model);updateModelBtn();mdlg.close()};
      mlist.append(r);
    });
  });
  if(!n&&q){mlist.innerHTML='<div class="mempty">Tidak ada model gratis yang cocok.</div>'}
  $('#mfoot').textContent=modelsLive
    ?'Hanya model gratis. Ada batas token harian dari xKiro.'
    :'Daftar offline, mungkin tidak terbaru. Hanya model gratis.';
}
msearch.addEventListener('input',renderModels);
$('#modelBtn').onclick=()=>{
  msearch.value=''; renderModels(); mlist.scrollTop=0; mdlg.showModal(); $('#modelBtn').setAttribute('aria-expanded','true');
};
mdlg.addEventListener('close',()=>$('#modelBtn').setAttribute('aria-expanded','false'));
mdlg.addEventListener('click',e=>{if(e.target===mdlg)mdlg.close()});

/* ===== tema, sidebar ===== */
let chats=[], currentId=null, busy=false, ctrl=null, user=null, freshId=null;
const msgsEl=$('#msgs'), input=$('#input'), scrollEl=$('#scroll');

function setTheme(t){

}

const toggleSide=o=>document.body.classList.toggle('open',o);
$('#menuBtn').onclick=()=>toggleSide(true);
$('#shade').onclick=()=>toggleSide(false);

const current=()=>chats.find(c=>c.id===currentId);
const persist=()=>user&&store.set('codix:chats:'+user,JSON.stringify(chats));

function renderList(){
  const list=$('#list'); list.innerHTML='';
  chats.forEach(c=>{
    const row=document.createElement('div'); row.className='item'+(c.id===currentId?' active':'')+(c.id===freshId?' fresh':'');
    const t=document.createElement('button'); t.className='t'; t.textContent=c.title;
    t.onclick=()=>{if(busy||c.id===currentId)return;currentId=c.id;renderAll(0,true);toggleSide(false)};
    const d=document.createElement('button'); d.className='del'; d.setAttribute('aria-label','Hapus chat');
    d.innerHTML='<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
    d.onclick=e=>{e.stopPropagation();if(busy)return;chats=chats.filter(x=>x.id!==c.id);if(currentId===c.id)currentId=null;persist();renderAll()};
    row.append(t,d); list.append(row);
  });
}

/* ===== markdown ===== */
marked.setOptions({gfm:true,breaks:true});
function md(text){return DOMPurify.sanitize(marked.parse(text||''))}

function decorate(el){
  el.querySelectorAll('pre').forEach(pre=>{
    if(pre.parentElement.classList.contains('codebox'))return;
    const code=pre.querySelector('code'); if(!code)return;
    const lang=(code.className.match(/language-(\w+)/)||[])[1]||'kode';
    try{hljs.highlightElement(code)}catch(e){}
    const box=document.createElement('div'); box.className='codebox';
    const bar=document.createElement('div'); bar.className='codebar';
    bar.innerHTML='<span></span><button class="copy"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg><span>Salin</span></button>';
    bar.firstChild.textContent=lang;
    bar.querySelector('.copy').onclick=async e=>{
      const b=e.currentTarget;
      try{await navigator.clipboard.writeText(code.innerText)}catch(err){
        const r=document.createRange();r.selectNodeContents(code);const s=getSelection();s.removeAllRanges();s.addRange(r);document.execCommand('copy');s.removeAllRanges()}
      b.lastChild.textContent='Tersalin'; setTimeout(()=>b.lastChild.textContent='Salin',1400);
    };
    pre.replaceWith(box); box.append(bar,pre);
  });
}

/* ===== render pesan ===== */
const SUGG=[
  'Jelasin perbedaan async/await dan Promise di JavaScript',
  'Bikin REST API sederhana pakai Python FastAPI',
  'Kenapa kode React gue re-render terus? Bantu debug',
  'Optimasi query SQL yang lambat'
];

function renderAll(animateLast=0,swap=false){
  renderList(); msgsEl.innerHTML='';
  if(swap){msgsEl.classList.remove('swap');void msgsEl.offsetWidth;msgsEl.classList.add('swap')}
  const c=current();
  if(!c||!c.messages.length){
    const e=document.createElement('div'); e.className='empty';
    e.innerHTML='<div class="logo">&lt;/&gt;</div><h1>Codix AI</h1><p>Asisten coding kamu. Mau bikin apa hari ini?</p><div class="sugg"></div>';
    SUGG.forEach((s,i)=>{const b=document.createElement('button');b.style.animationDelay=(.22+i*.07)+'s';b.textContent=s;b.onclick=()=>send(s);e.querySelector('.sugg').append(b)});
    msgsEl.append(e); return;
  }
  c.messages.forEach((m,i)=>msgsEl.append(buildMsg(m,i>=c.messages.length-animateLast)));
  scrollEl.scrollTop=scrollEl.scrollHeight;
}

function buildMsg(m,anim){
  const d=document.createElement('div');
  if(m.role==='user'){
    d.className='msg user'; const b=document.createElement('div'); b.className='bubble'; b.textContent=m.content; d.append(b);
  }else{
    d.className='msg ai';
    d.innerHTML='<div class="who"><span class="logo">&lt;/&gt;</span>Codix AI</div><div class="md"></div>';
    const body=d.querySelector('.md'); body.innerHTML=md(m.content); decorate(body);
  }
  if(anim)d.classList.add('enter');
  return d;
}

function showError(t,soft){const e=$('#err');e.textContent=t;e.classList.toggle('soft',!!soft);e.style.display=t?'block':'none'}

/* ===== streaming dari xKiro ===== */
async function* sse(res){
  const reader=res.body.getReader(),dec=new TextDecoder();let buf='';
  while(true){
    const {done,value}=await reader.read(); if(done)break;
    buf+=dec.decode(value,{stream:true});
    const lines=buf.split('\n'); buf=lines.pop();
    for(const l of lines){ if(l.startsWith('data:')){const d=l.slice(5).trim(); if(d&&d!=='[DONE]')yield d} }
  }
}

function post(messages,signal,mid){
  return fetch(API+'/chat/completions',{
    method:'POST',signal,
    headers:{'content-type':'application/json','authorization':'Bearer '+KEY},
    body:JSON.stringify({model:mid,stream:true,messages})
  });
}

async function request(history,onToken,signal,mid){
  let res=await post([{role:'system',content:SYSTEM},...history],signal,mid);
  if(res.status===400){
    /* beberapa model (mis. Gemma) tidak menerima system prompt: gabung ke pesan user pertama */
    const h=history.map(x=>({...x}));
    const i=h.findIndex(x=>x.role==='user');
    if(i>=0)h[i].content=SYSTEM+'\n\n---\n\n'+h[i].content;
    const r2=await post(h,signal,mid);
    if(r2.ok)res=r2;
  }
  if(!res.ok){const msg=await errText(res);throw Object.assign(new Error(msg),{status:res.status})}
  for await(const d of sse(res)){
    let j; try{j=JSON.parse(d)}catch(e){continue}
    if(j.error)throw Object.assign(new Error(j.error.message||'Model mengirim error.'),{status:Number(j.error.code)||500});
    const t=j.choices?.[0]?.delta?.content; if(t)onToken(t);
  }
}

async function errText(res){
  let t=''; try{t=await res.text(); const j=JSON.parse(t); t=j.error?.message||j.message||t}catch(e){}
  const hint={
    401:'API key salah atau sudah tidak aktif.',
    402:'Model ini butuh saldo atau paket berbayar. Pilih model gratis lain.',
    403:'Model ini butuh paket berbayar. Pilih model gratis lain.',
    404:'Model ini tidak tersedia, pilih model lain.',
    429:'Jatah token gratis harian habis atau terlalu cepat. Tunggu sebentar atau ganti model.'
  }[res.status];
  return (hint?hint+' ':'')+'(Error '+res.status+(t?': '+t:'')+')';
}

function setBusy(b){
  busy=b;
  $('#goIcon').innerHTML=b?'<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>':'<path d="M12 19V5M5 12l7-7 7 7"/>';
  $('#go').disabled=!b&&!input.value.trim();
  $('#go').setAttribute('aria-label',b?'Berhenti':'Kirim');
}

async function send(text){
  text=(text||'').trim(); if(busy||!text)return;
  if(!KEY){showError(NO_KEY_MSG);return}
  showError('');
  let c=current();
  if(!c){c={id:Date.now().toString(36),title:text.slice(0,40),messages:[]};chats.unshift(c);currentId=c.id;freshId=c.id;setTimeout(()=>freshId=null,700)}
  const history=c.messages.map(m=>({role:m.role,content:m.content}));
  history.push({role:'user',content:text});
  c.messages.push({role:'user',content:text});
  const ai={role:'assistant',content:''}; c.messages.push(ai);
  input.value=''; autosize();
  renderAll(2);
  const node=msgsEl.lastElementChild, body=node.querySelector('.md');
  body.innerHTML='<span class="dots"><i></i><i></i><i></i></span>';
  setBusy(true); ctrl=new AbortController();
  let raf=0;
  const paint=()=>{raf=0;body.classList.add('cursor');body.innerHTML=md(ai.content);scrollEl.scrollTop=scrollEl.scrollHeight};
  /* kalau server error: coba model yang sama sekali lagi, lalu model gratis cadangan */
  const alts=['deepseek/deepseek-v4-flash','qwen/qwen3.8-max:free','mistralai/codestral-2508'].filter(id=>id!==model&&MODELS.some(m=>m.id===id));
  const queue=[model,model,...alts];
  let used=model, lastErr=null;
  for(let i=0;i<queue.length;i++){
    used=queue[i];
    try{
      await request(history,t=>{ai.content+=t;if(!raf)raf=requestAnimationFrame(paint)},ctrl.signal,used);
      lastErr=null; break;
    }catch(e){
      lastErr=e;
      if(e.name==='AbortError'||ai.content||e.status===401)break;
      if(i===0&&!(e.status>=500||e.message==='Failed to fetch'))i++; /* bukan error server: langsung ke model cadangan */
      if(i<queue.length-1)await new Promise(r=>setTimeout(r,800));
    }
  }
  if(lastErr&&lastErr.name!=='AbortError'){
    let msg=lastErr.message==='Failed to fetch'?'Gagal terhubung ke xKiro. Cek koneksi internet kamu.':lastErr.message;
    if(lastErr.status>=500)msg+=' Server xKiro lagi bermasalah. Coba lagi sebentar atau pilih model lain lewat tombol model di atas.';
    showError(msg);
    if(!ai.content){c.messages.splice(-2,2);input.value=text;autosize()}
  }else if(!lastErr&&used!==model){
    showError('Model '+nameOf(model)+' lagi error, jawaban ini dari '+nameOf(used)+'.',true);
  }
  cancelAnimationFrame(raf);
  if(!ai.content&&c.messages.includes(ai)){c.messages.splice(-2,2)}
  const removed=!c.messages.includes(ai);
  if(!c.messages.length){chats=chats.filter(x=>x!==c);if(currentId===c.id)currentId=null}
  persist(); ctrl=null; setBusy(false);
  if(removed||!user)renderAll();
  else{body.classList.remove('cursor');body.innerHTML=md(ai.content);decorate(body);renderList()}
  input.focus();
}

/* ===== input ===== */
function autosize(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,200)+'px';if(!busy)$('#go').disabled=!input.value.trim()}
input.addEventListener('input',autosize);
input.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&matchMedia('(hover:hover)').matches){e.preventDefault();send(input.value)}
});
$('#go').onclick=()=>busy?ctrl&&ctrl.abort():send(input.value);
$('#newChat').onclick=()=>{if(busy)return;currentId=null;showError('');renderAll(0,true);toggleSide(false);input.focus()};

/* ===== akun: daftar & masuk ===== */
const authEl=$('#auth'), uIn=$('#au'), pIn=$('#ap'), aErr=$('#aerr'), aBtn=$('#abtn');
const tLogin=$('#tLogin'), tReg=$('#tReg');
let mode='login';
const users=()=>load('codix:users',{});
const saveUsers=u=>store.set('codix:users',JSON.stringify(u));

async function hashPw(pw,salt){
  const data=salt+':'+pw;
  try{
    if(window.crypto&&crypto.subtle){
      const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(data));
      return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  let h=5381; for(const ch of data)h=((h<<5)+h+ch.charCodeAt(0))>>>0;
  return 'x'+h.toString(16);
}

function setMode(m){
  mode=m;
  $('#tabs').classList.toggle('reg',m==='register');
  tLogin.classList.toggle('active',m==='login'); tReg.classList.toggle('active',m==='register');
  aBtn.textContent=m==='login'?'Masuk':'Daftar';
  $('#asub').textContent=m==='login'?'Masuk untuk lanjut ngoding.':'Daftar cuma butuh username dan password.';
  pIn.autocomplete=m==='login'?'current-password':'new-password';
  aErr.textContent='';
  const f=$('#aform'); f.classList.remove('swap'); void f.offsetWidth; f.classList.add('swap');
}
tLogin.onclick=()=>setMode('login');
tReg.onclick=()=>setMode('register');

function authError(t){
  aErr.textContent=t;
  const c=$('#card'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
}

async function doAuth(){
  const name=uIn.value.trim().toLowerCase(), pw=pIn.value;
  if(!/^[a-z0-9_]{3,20}$/.test(name))return authError('Username 3-20 karakter: huruf, angka, atau _');
  if(pw.length<4)return authError('Password minimal 4 karakter');
  aBtn.disabled=true;
  try{
    const db=users();
    if(mode==='register'){
      if(db[name])return authError('Username sudah dipakai, coba yang lain');
      const salt=Math.random().toString(36).slice(2)+Date.now().toString(36);
      db[name]={salt,hash:await hashPw(pw,salt)}; saveUsers(db);
    }else{
      const u=db[name];
      if(!u||u.hash!==await hashPw(pw,u.salt))return authError('Username atau password salah');
    }
    store.set('codix:session',name); enter(name);
  }catch(err){
    authError('Terjadi kesalahan: '+(err&&err.message||err));
  }finally{aBtn.disabled=false}
}
aBtn.onclick=doAuth;
[uIn,pIn].forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doAuth()}}));

function enter(name){
  user=name; chats=load('codix:chats:'+name,[]); currentId=null; freshId=null;
  $('#uname').textContent=name; $('#avatar').textContent=name[0].toUpperCase();
  uIn.value=''; pIn.value=''; aErr.textContent='';
  authEl.classList.add('hide');
  renderAll(); autosize();
  if(!KEY)showError(NO_KEY_MSG);
  else setTimeout(()=>input.focus(),500);
}

function logout(){
  if(busy&&ctrl)ctrl.abort();
  store.set('codix:session',''); user=null; chats=[]; currentId=null;
  toggleSide(false); showError(''); setMode('login');
  authEl.classList.remove('hide');
  setTimeout(()=>{renderAll();uIn.focus()},500);
}
$('#logout').onclick=logout;

/* ===== mulai ===== */
updateModelBtn(); fetchModels(); autosize();
const sess=store.get('codix:session');
if(sess&&users()[sess]){
  authEl.classList.add('instant','hide'); enter(sess);
  requestAnimationFrame(()=>requestAnimationFrame(()=>authEl.classList.remove('instant')));
}else{
  renderAll(); setMode('login'); setTimeout(()=>uIn.focus(),600);
}
